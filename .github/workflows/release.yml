name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check the release settings
        env:
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [ -n "$UPDATER_PUBKEY" ] || missing+=("variable UPDATER_PUBKEY")
          [ "$HAS_SIGNING_KEY" = "true" ] || missing+=("secret TAURI_SIGNING_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing %s\n' "${missing[@]}"
            exit 1
          fi
          make release-check TAG="$GITHUB_REF_NAME"

      - name: Build the app, DMG and signed updater archive
        env:
          UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: make release-bundle

      - name: Collect the release files and latest.json
        run: make release-assets REPO="$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/release-assets
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Recast ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            ./*.dmg ./*.app.tar.gz ./*.app.tar.gz.sig latest.json
