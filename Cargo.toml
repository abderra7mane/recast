[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
recast-capture = { path = "crates/recast-capture" }
recast-input = { path = "crates/recast-input" }
recast-project = { path = "crates/recast-project" }
recast-zoom = { path = "crates/recast-zoom" }
recast-render = { path = "crates/recast-render" }
recast-export = { path = "crates/recast-export" }

cidre = { version = "=0.29.0", default-features = false, features = [
  "macos_14_0",
  "sc",
  "av",
  "at",
  "cat",
  "cm",
  "cv",
  "cf",
  "cg",
  "ns",
  "ut",
  "dispatch",
  "blocks",
  "async",
  "objc",
] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3.1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
libc = "0.2"
log = "0.4"
tempfile = "3"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Per-pixel work (NV12 conversion of preview frames) is too slow unoptimized.
[profile.dev.package.recast-render]
opt-level = 2

# Xcode 27's `strip` leaves proc-macro dylibs that dyld refuses to load
# ("mis-aligned LINKEDIT string pool"), so build scripts and macros stay unstripped.
[profile.release.build-override]
strip = false
