[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
recast-capture = { path = "crates/recast-capture" }
recast-input = { path = "crates/recast-input" }
recast-project = { path = "crates/recast-project" }

cidre = { version = "=0.29.0", default-features = false, features = [
  "macos_14_0",
  "sc",
  "av",
  "at",
  "cat",
  "cm",
  "cv",
  "cf",
  "cg",
  "ns",
  "ut",
  "dispatch",
  "blocks",
  "async",
  "objc",
] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3.1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
libc = "0.2"
log = "0.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Xcode 27's `strip` leaves proc-macro dylibs that dyld refuses to load
# ("mis-aligned LINKEDIT string pool"), so build scripts and macros stay unstripped.
[profile.release.build-override]
strip = false
