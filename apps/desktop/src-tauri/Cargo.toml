[package]
name = "recast-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "recast-desktop"

[lib]
name = "recast_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
recast-capture.workspace = true
recast-input.workspace = true
recast-project.workspace = true
recast-export.workspace = true
recast-render.workspace = true
recast-zoom.workspace = true
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
cpal = "=0.18.2"
tungstenite = "=0.30.0"
getrandom = "0.3.4"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "=0.0.12"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cidre = { workspace = true, optional = true }
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
  "std",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSFileManager",
  "NSGeometry",
  "NSObject",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-app-kit = { workspace = true, features = [
  "std",
  "objc2-core-foundation",
  "NSAttributedString",
  "NSBezierPath",
  "NSBitmapImageRep",
  "NSColor",
  "NSCursor",
  "NSDragging",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPanel",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSScreen",
  "NSStringDrawing",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }
dispatch2 = "0.3.1"
tokio = { version = "1.53.2", features = ["sync"] }
base64 = "0.22.1"

[dev-dependencies]
tempfile.workspace = true

[features]
synthetic = ["recast-capture/synthetic", "dep:cidre"]

[lints]
workspace = true
